# A pod that hammers the api-gateway through its Service DNS name, so the HPA
# sees CPU climb. It also proves in-cluster DNS: it reaches the service by name,
# never by IP.
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "while true; do wget -q -O- http://api-gateway.default.svc.cluster.local/ >/dev/null 2>&1; done"
