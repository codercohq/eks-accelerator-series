apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: app
          image: inventory-service:latest        # overlays set the real registry + tag
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
          # requests are what the scheduler packs on. limits cap the noisy neighbour.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          # readiness gates traffic: a pod is only sent requests once /healthz is ok.
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          # liveness restarts a wedged pod. Keep it cheap and off the DB path.
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 80
      targetPort: 8080
