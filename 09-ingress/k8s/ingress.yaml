# The real Ingress for the api-gateway. One hostname, routed to the gateway
# Service. Swap app.example.com for your own domain, the one EP10 will attach a
# real certificate to.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
