# Real-AWS Traefik. The Service is a LoadBalancer, and the annotations tell the
# AWS Load Balancer Controller to make an internet-facing NLB with target-type
# ip (so it points straight at the Traefik pods through the VPC CNI, not at node
# ports). The subnet discovery tags from EP3 are how the controller finds where
# to put it.
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

# Spread the ingress across nodes so losing one node does not drop all traffic.
deployment:
  replicas: 2

# A pod disruption budget keeps at least one Traefik pod during node drains.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
