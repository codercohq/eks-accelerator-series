# Map the node's 80 and 443 to your laptop, so once Traefik is listening you can
# curl localhost. On EKS the NLB does this job; on Kind these port mappings are
# the stand-in.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ingress-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
