# These replace the placeholder Secrets from EP7. The operator builds the same
# Secret objects (postgres, valkey) that the StatefulSets already mount, this
# time from Secrets Manager rather than a password typed into the repo.
#
# Seed the source secrets once (values are examples, use your own):
#   aws secretsmanager create-secret --name eks-accel/dev/postgres \
#     --secret-string '{"username":"app","dbname":"app","password":"..."}'
#   aws secretsmanager create-secret --name eks-accel/dev/valkey \
#     --secret-string '{"password":"..."}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: postgres          # same Secret name the Postgres StatefulSet expects
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: eks-accel/dev/postgres
        property: username
    - secretKey: POSTGRES_DB
      remoteRef:
        key: eks-accel/dev/postgres
        property: dbname
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: eks-accel/dev/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: valkey
    creationPolicy: Owner
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: eks-accel/dev/valkey
        property: password
