# The real-AWS SecretStore. Points at AWS Secrets Manager in your region.
# There is no auth block on purpose: the operator uses its own IRSA role, the
# one the terraform module creates and annotates onto the controller's service
# account. No access keys anywhere, which is the whole point.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
