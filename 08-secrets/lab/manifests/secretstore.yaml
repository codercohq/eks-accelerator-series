# The static keys LocalStack accepts. LocalStack ignores the values, so
# test/test is fine. On real AWS you delete this Secret and the operator uses
# its IRSA role instead, which is the whole point of the cloud version.
apiVersion: v1
kind: Secret
metadata:
  name: localstack-creds
type: Opaque
stringData:
  access-key-id: test
  secret-access-key: test
---
# A SecretStore names where secrets come from. Here that is LocalStack's
# Secrets Manager, reached with the static keys above.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: localstack
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: localstack-creds
            key: access-key-id
          secretAccessKeySecretRef:
            name: localstack-creds
            key: secret-access-key
