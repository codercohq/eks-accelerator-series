# An ExternalSecret is the request: take this key out of Secrets Manager and
# make a Kubernetes Secret from it. The operator keeps the Secret in step with
# the source, rechecking every refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 15s          # short so the rotation demo is quick to watch
  secretStoreRef:
    name: localstack
    kind: SecretStore
  target:
    name: postgres              # the Kubernetes Secret the operator creates
    creationPolicy: Owner
  # Pull the three fields Postgres needs, so the StatefulSet can boot straight
  # off this Secret with no password written anywhere by hand.
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: eks-accel/dev/postgres     # the secret's name in Secrets Manager
        property: username              # pull this field out of the JSON
    - secretKey: POSTGRES_DB
      remoteRef:
        key: eks-accel/dev/postgres
        property: dbname
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: eks-accel/dev/postgres
        property: password
